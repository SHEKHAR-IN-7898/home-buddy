<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>Home Buddy — Sign in</title><link rel="stylesheet" href="/styles.css"><style>.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,460px);background:#fff;border:1px solid #e3e8ee;border-radius:28px;padding:28px;box-shadow:0 25px 70px #17202a14}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.role{border:1px solid #dfe6ed;background:#f8fafc;border-radius:18px;padding:18px;text-align:left;cursor:pointer}.role.active{border:2px solid #2563eb;background:#eaf2ff}.role b{display:block;font-size:15px;margin-bottom:5px}.role span{font-size:11px;color:#687786}.login-form{display:grid;gap:12px}.login-form input{padding:14px;border:1px solid #dce3ea;border-radius:13px;font:inherit}.tiny{font-size:11px;color:#7a8794}.brand-lg{font-size:12px;font-weight:900;letter-spacing:.15em;color:#2563eb}</style></head><body><div class="login"><section class="login-card"><div class="brand-lg">HOME BUDDY</div><h1>Welcome back.</h1><p>One account for customers and service businesses.</p><div class="role-grid"><button class="role active" data-role="customer">👤<b>Customer</b><span>Book & track home services</span></button><button class="role" data-role="business">🏢<b>Business</b><span>Manage jobs & technicians</span></button></div><form class="login-form" id="loginForm"><input type="email" id="email" placeholder="Email address" required><button class="primary">Continue with email</button></form><p class="tiny">Passwordless sign-in. Your role determines the dashboard you see.</p></section></div><script>let role='customer';document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('hb_role',role);location.href=role==='business'?'/business/':'/'};</script></body></html>
